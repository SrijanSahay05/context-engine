[project]
name = "context-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "psycopg[binary]>=3.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.mypy]
python_version = "3.15"
files = ["core", "db", "main.py", "tests"]
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
