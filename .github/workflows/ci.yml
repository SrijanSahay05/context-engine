name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: context_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d context_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: context_engine_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/context_engine_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
      - name: Install Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync flake8 .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head
      - name: Verify migration revision
        run: uv run --no-sync alembic current --check-heads
      - name: Test
        run: uv run --no-sync pytest
